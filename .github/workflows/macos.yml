name: macOS build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test state, cross-process storage and screen saver rendering
        run: bash scripts/test.sh
      - name: Build universal app
        run: bash scripts/build.sh
      - name: Verify signatures and architectures
        run: |
          codesign --verify --deep --strict build/QScreen.app
          codesign --verify --strict build/QScreen.saver
          lipo -verify_arch arm64 x86_64 build/QScreen.app/Contents/MacOS/QScreen
          lipo -verify_arch arm64 x86_64 build/QScreen.saver/Contents/MacOS/QScreen
