name: macOS build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test state, cross-process storage and screen saver rendering
        run: bash scripts/test.sh
      - name: Build universal app
        run: bash scripts/build.sh
      - name: Verify signatures and architectures
        run: bash scripts/verify.sh
